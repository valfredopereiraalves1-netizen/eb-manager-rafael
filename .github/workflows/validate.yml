name: Validate EB Manager
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax
        run: node --check server.js
      - name: Check browser scripts
        run: |
          node --check public/access.js
          node --check public/app.js || true
